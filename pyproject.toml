[project]
name = "pockettopo-decompilation"
version = "0.1.0"
description = "Reproducible PocketTopo 1.372 decompilation research"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false
required-version = "==0.11.8"

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["decompiled", "inputs", ".cache"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
